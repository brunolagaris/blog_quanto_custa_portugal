<aside class="hidden lg:flex flex-col w-64 bg-dash-blue text-white transition-all duration-300">
    <div class="p-6 flex items-center gap-3">
        <span class="material-symbols-outlined text-dash-orange !text-32px">account_balance</span>
        <div class="flex flex-col">
            <span class="text-sm font-black tracking-tight leading-none">QUANTO CUSTA</span>
            <span class="text-[10px] font-bold opacity-70 leading-none">PORTUGAL</span>
        </div>
    </div>

    <nav class="flex-1 px-4 space-y-2 mt-4">
        <a href="{% url 'dashboard_index' %}" class="sidebar-link {% if request.resolver_match.url_name == 'dashboard_index' %}active{% endif %} flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition-all">
            <span class="material-symbols-outlined !text-20px">dashboard</span>
            <span class="text-sm font-medium">Dashboard</span>
        </a>
        
        <a href="{% url 'ads_index' %}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition-all">
            <span class="material-symbols-outlined !text-20px">campaign</span>
            <span class="text-sm font-medium">Anúncios</span>
        </a>

        <a href="{% url 'articles_index' %}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition-all">
            <span class="material-symbols-outlined !text-20px">article</span>
            <span class="text-sm font-medium">Artigos</span>
        </a>

        <a href="{% url 'calculators_index' %}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition-all">
            <span class="material-symbols-outlined !text-20px">calculate</span>
            <span class="text-sm font-medium">Calculadoras</span>
        </a>

        <a href="{% url 'users_index' %}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition-all">
            <span class="material-symbols-outlined !text-20px">group</span>
            <span class="text-sm font-medium">Usuários</span>
        </a>

        <a href="{% url 'settings_index' %}" class="sidebar-link flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition-all">
            <span class="material-symbols-outlined !text-20px">settings</span>
            <span class="text-sm font-medium">Configurações</span>
        </a>
    </nav>

    <div class="p-4 border-t border-white/10">
        <form action="{% url 'admin:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="flex items-center gap-3 px-2 w-full hover:opacity-80 transition-opacity">
                <div class="size-8 rounded-full bg-dash-orange flex items-center justify-center font-bold text-xs">
                    {{ user.username|slice:":2"|upper }}
                </div>
                <div class="flex flex-col overflow-hidden text-left">
                    <span class="text-xs font-bold truncate">{{ user.username }}</span>
                    <span class="text-[10px] opacity-50 truncate">Sair do sistema</span>
                </div>
            </button>
        </form>
    </div>
</aside>
