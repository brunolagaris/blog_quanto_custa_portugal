<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10 shrink-0">
    <div class="flex items-center gap-4">
        <h2 class="text-sm font-black text-dash-blue uppercase tracking-wider">
            {% block page_title %}Visão Geral{% endblock %}
        </h2>
    </div>

    <div class="flex items-center gap-6">
        <a href="{% url 'articles_list' %}"
            class="bg-dash-orange text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 shadow-lg shadow-orange-500/20 hover:scale-105 transition-all">
            <span class="material-symbols-outlined !text-18px">add</span>
            Novo Conteúdo
        </a>
        <div class="h-8 w-[1px] bg-slate-200"></div>
        <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
                <p class="text-xs font-bold text-dash-blue leading-none">{{ user.username }}</p>
                <p class="text-[10px] text-slate-500 uppercase font-medium">Admin</p>
            </div>
            <div
                class="size-9 rounded-full bg-dash-blue border-2 border-dash-yellow flex items-center justify-center text-white text-xs font-black">
                {{ user.username|slice:":2"|upper }}
            </div>
        </div>
    </div>
</header>
